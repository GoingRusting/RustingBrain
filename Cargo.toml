[package]
name = "rusting_brain"
version = "0.1.1"
edition = "2024"
description = "A small Rust neural-network library for learning, training, and inference experiments."
readme = "README.md"
license-file = "LICENSE.md"
rust-version = "1.85"
documentation = "https://docs.rs/rusting_brain"
homepage = "https://github.com/Vasyl-Trefilov/RustingBrain"
repository = "https://github.com/Vasyl-Trefilov/RustingBrain.git"
keywords = ["neural-network", "machine-learning", "onnx", "cuda", "education"]
categories = ["science", "algorithms"]

[dependencies]
matrixmultiply = "0.3.10"
rayon = "1.11.0"
rand = { version = "0.8", features =["std", "std_rng"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
cudarc = { version = "0.19.3", optional = true, default-features = false, features = ["std", "cublas", "nvrtc", "runtime", "dynamic-loading", "cuda-13010"] }
tract-onnx = { version = "0.21", optional = true }

[features]
default = []
cuda = ["dep:cudarc"]
# Compatibility aliases. Cargo features are additive, so selecting a concrete
# ABI in each alias makes `--all-features` invalid. The crate now has one
# supported backend ABI and keeps the historic names as source-compatible aliases.
cuda-11-8 = ["cuda"]
cuda-12-0 = ["cuda"]
cuda-12-4 = ["cuda"]
cuda-12-6 = ["cuda"]
cuda-12-8 = ["cuda"]
cuda-13-0 = ["cuda"]
cuda-13-1 = ["cuda"]
onnx = ["dep:tract-onnx"]

[[example]]
name = "cuda_training_smoke"
required-features = ["cuda"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
